name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The CLI scans the full history on every run. The gitleaks action fails on a repo's first push.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  code-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          languages: python, javascript-typescript, actions
      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          upload: never
          upload-database: false
          output: codeql-results
      # CodeQL reports findings without failing the job, so this step is what blocks.
      - name: Fail on findings
        run: |
          jq -r '.runs[].results[]? | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' codeql-results/*.sarif > findings.txt
          cat findings.txt
          test ! -s findings.txt

  # Checks that each version of the stack is valid without deploying it, so no AWS credentials are needed.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Lint the CloudFormation template
        run: pip install cfn-lint && cfn-lint cloudformation/template.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Synthesize the CDK app
        working-directory: cdk
        run: npm ci && npx cdk synth --quiet
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Validate the Terraform
        working-directory: terraform
        run: terraform fmt -check && terraform init -backend=false && terraform validate
      - name: Check the scripts
        run: |
          pip install -r scripts/requirements.txt
          python -m py_compile scripts/*.py
          python -c "import boto3; boto3.client('devops-agent', region_name='us-east-1')"
